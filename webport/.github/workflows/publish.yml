name: Build and publish iPhone web game
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: emscripten-core/setup-emsdk@v15
        with:
          version: 6.0.9
          actions-cache-folder: emsdk-cache
      - name: Compile WebAssembly
        run: bash scripts/build_web.sh
      - name: Save compiled website as downloadable ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: flame-lantern-iphone-website
          path: site
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
